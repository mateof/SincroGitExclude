appId: com.sincrogitexclude.app
productName: SincroGitExclude
directories:
  buildResources: resources
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!node_modules/onnxruntime-web/**'
  - '!node_modules/sharp/**'
  - '!node_modules/@img/**'
npmRebuild: true
asarUnpack:
  - 'node_modules/better-sqlite3/**'
  - 'node_modules/onnxruntime-node/**'
mac:
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v*/linux/**'
    - '!node_modules/onnxruntime-node/bin/napi-v*/win32/**'
  executableName: SincroGitExclude
  target:
    - dmg
  category: public.app-category.developer-tools
  identity: '-'
  hardenedRuntime: false
  extendInfo:
    NSLocalNetworkUsageDescription: SincroGitExclude connects to git remotes on your local network, such as a repository on a NAS.
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v*/darwin/**'
    - '!node_modules/onnxruntime-node/bin/napi-v*/win32/**'
  executableName: sincrogitexclude
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
deb:
  artifactName: ${name}-${version}-${arch}.${ext}
win:
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v*/darwin/**'
    - '!node_modules/onnxruntime-node/bin/napi-v*/linux/**'
  executableName: SincroGitExclude
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
