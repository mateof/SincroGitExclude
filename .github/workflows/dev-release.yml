name: Dev Prerelease

# Triggered by a prerelease tag pushed on any branch, e.g. v1.20.0-dev.1
#
# Unlike release.yml, the tag drives the version instead of package.json: the
# tag already exists when this runs (it is the trigger), so the "skip if the tag
# exists" guard from release.yml must NOT be reused here.
on:
  push:
    tags:
      - 'v*-dev*'

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Prerelease
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building prerelease $VERSION from tag $TAG"

  build-windows:
    name: Build Windows
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # electron-builder.yml uses ${version} in every artifactName, so the
      # installers would carry the package.json version instead of the tag's.
      # Patched in the workspace only — never committed.
      - name: Set version from tag
        shell: bash
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run build && npx electron-builder --win --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
          retention-days: 5

  build-macos:
    name: Build macOS
    needs: prepare
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set version from tag
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build and package (arm64)
        run: npm run build && npx electron-builder --mac --arm64 --publish never

      - name: Build and package (x64)
        run: npx electron-builder --mac --x64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            dist/*.dmg
          retention-days: 5

  build-linux:
    name: Build Linux
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set version from tag
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run build && npx electron-builder --linux --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.AppImage
            dist/*.deb
          retention-days: 5

  prerelease:
    name: Create Prerelease
    needs: [prepare, build-windows, build-macos, build-linux]
    if: |
      always() &&
      (needs.build-windows.result == 'success' || needs.build-macos.result == 'success' || needs.build-linux.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build status summary
        run: |
          echo "Build Results:"
          echo "  Windows: ${{ needs.build-windows.result }}"
          echo "  macOS:   ${{ needs.build-macos.result }}"
          echo "  Linux:   ${{ needs.build-linux.result }}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -50

      - name: Create prerelease and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ needs.prepare.outputs.tag }}
          VERSION=${{ needs.prepare.outputs.version }}

          # --prerelease and no --latest, so this never displaces the stable
          # release shown on the repo front page
          gh release create "$TAG" \
            --title "SincroGitExclude $VERSION (dev)" \
            --notes "Build de desarrollo generado desde el tag \`$TAG\`. No es una version estable: sirve para probar cambios antes de mezclarlos en \`main\`." \
            --prerelease

          upload_with_retry() {
            local file=$1
            local max_attempts=5
            local attempt=1
            local delay=10

            while [ $attempt -le $max_attempts ]; do
              echo "Uploading $(basename $file) (attempt $attempt/$max_attempts)..."
              if gh release upload "$TAG" "$file" --clobber 2>&1; then
                echo "Uploaded $(basename $file)"
                return 0
              fi
              echo "Upload failed, retrying in ${delay}s..."
              sleep $delay
              delay=$((delay * 2))
              attempt=$((attempt + 1))
            done
            echo "Failed to upload $(basename $file)"
            return 1
          }

          find artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" \) | while read file; do
            upload_with_retry "$file"
            sleep 2
          done

          echo "Prerelease $TAG created!"
